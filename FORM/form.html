<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My form</title>
</head>
<body bgcolor="cyan">
     <center><table border="5"><tr><td><th><h1>Student Registration Form </h1></th></td></tr></table></center>

     <table>
        <tr>
            <td>Name:</td>
            <td><input type="text" placeholder="Enter full name"></td>
        </tr>
        <tr>
            <td>Father's name:</td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td>Mother's name:</td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td>Phone Number:</td>
            <td><input type="text" placeholder="07xxxxxxxx"></td>
        </tr>
        <tr>
            <td>Email:</td>
            <td><input type="text" placeholder="sample@example.com"></td>
        </tr>
        <tr>
            <td>Gender:</td>
            <td><input type="radio">Male
            <input type="radio">Female
            <input type="radio">Other
            </td>
        </tr>
        <tr>
            <td>Date Of Date:</td>
            <td><input type="date"></td>
        </tr>
        <tr>
            <td>Address:</td>
            <td><input type="text" placeholder="street- House- Road-" size="40"></td>
        </tr>
        <tr>
            <td>Blood Group:</td>
            <td><select name="" id="">
                <option value="">A</option>
                <option value="">B</option>
                <option value="">AB</option>
                <option value="">O</option>
            </select></td>
        </tr>
        <tr>
            <td>Department:</td>
            <td>
                <input type="radio">CSE
                <input type="radio">EEE
                <input type="radio">BBA
            </td>
        </tr>
        <tr>
            <td>Course:</td>
            <td>
                <input type="checkbox">C
                <input type="checkbox">C++
                <input type="checkbox">Java
                <input type="checkbox">AI
                <input type="checkbox">Machine learning
                <input type="checkbox">Robot
            </td>
        </tr>
        <tr>
            <td>Photo:</td>
            <td><input type="text" placeholder="Choose File" size="7"></td>
        </tr>     






















     </table>

</body>
</html>
