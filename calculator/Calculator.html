<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Calculator</title>

    <style>
        body {
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 400px;
            background-color: black;
            padding: 30px;
            margin: 30px auto;
            border-radius: 30px;
        }

        .welcome {
            background-color: white;
            color: black;
            text-align: center;
            padding: 25px 5px;
            border-radius: 25px;
            font-size: 30px;
            margin-bottom: 40px;
        }

        .display {
            color: white;
            text-align: right;
            font-size: 50px;
            padding: 20px;
            height: 70px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        button {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: none;
            font-size: 30px;
        }

        /* Grey buttons */
        .grey {
            background-color: #a6a6a6;
            color: black;
        }

        /* Dark number buttons */
        .dark {
            background-color: #2d2d2d;
            color: white;
        }

        /* Orange operation buttons */
        .orange {
            background-color: #ff9f0a;
            color: white;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <div class="welcome">
            Welcome to Calculator
        </div>

        <div class="display">
            0
        </div>

        <div class="buttons">

            <!-- First row -->
            <button class="grey">AC</button>
            <button class="grey">←</button>
            <button class="grey">%</button>
            <button class="orange">÷</button>

            <!-- Second row -->
            <button class="dark">7</button>
            <button class="dark">8</button>
            <button class="dark">9</button>
            <button class="orange">×</button>

            <!-- Third row -->
            <button class="dark">4</button>
            <button class="dark">5</button>
            <button class="dark">6</button>
            <button class="orange">−</button>

            <!-- Fourth row -->
            <button class="dark">1</button>
            <button class="dark">2</button>
            <button class="dark">3</button>
            <button class="orange">+</button>

            <!-- Fifth row -->
            <button class="dark">0</button>
            <button class="dark">00</button>
            <button class="dark">.</button>
            <button class="orange">=</button>

        </div>

    </div>


 h </body></html>
